<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>數學城市</title>
<style>:root{--bg:#f4f7fb;--ink:#203047;--muted:#6b7a90;--blue:#5c8df6;--green:#55b98b;--line:#e7edf5}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}.app{max-width:900px;margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900}.gear{border:0;background:#fff;border-radius:14px;padding:10px 13px;font-size:18px}.hero,.card,.quiz{background:#fff;border-radius:24px;padding:20px;margin-top:16px;box-shadow:0 10px 30px #31435a12}.hero{background:linear-gradient(135deg,#fff6d8,#e7f8ff)}.row{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#fff;border-radius:14px;padding:10px 13px;font-weight:700}.xp,.bar{height:11px;background:#e8edf4;border-radius:99px;overflow:hidden;margin:9px 0}.xp i,.bar i{display:block;height:100%;background:var(--green)}button.primary{width:100%;border:0;border-radius:18px;padding:17px;font-size:19px;font-weight:900;background:var(--blue);color:#fff;margin-top:14px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;background:#dff0cf;padding:12px;border-radius:20px}.tile{aspect-ratio:1;border-radius:12px;background:#bfe39f;display:grid;place-items:center;font-size:28px}.small{font-size:13px;color:var(--muted)}.hidden{display:none!important}.qno{color:var(--blue);font-weight:800}.question{font-size:23px;font-weight:850;line-height:1.5;margin:18px 0}.answers{display:grid;gap:10px}.ans{border:2px solid var(--line);background:#fff;border-radius:16px;padding:15px;font-size:18px;text-align:left}.feedback{margin-top:14px;padding:13px;border-radius:14px;background:#f3f7ff}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;border-top:1px solid var(--line);display:flex;justify-content:center;gap:35px;padding:11px}.nav button{border:0;background:none;font-weight:800;color:var(--muted)}@media(max-width:600px){.cards{grid-template-columns:1fr}}</style></head>
<body><main class="app"><div class="top"><div class="brand">🏙️ 數學城市</div><button class="gear" onclick="parentMode()">⚙️</button></div>
<section id="home"><div class="hero"><div class="row"><span class="pill">Lv. 1 城市開拓者</span><span class="pill">🔥 連續 0 天</span></div><h1>今天也讓城市長大一點吧！</h1><div class="small">EXP 340 / 1000</div><div class="xp"><i style="width:34%"></i></div><button class="primary" onclick="startQuiz()">開始今天的 10 題</button></div>
<div class="cards"><div class="card"><h3>🌱 我的城市</h3><div class="grid"><div class="tile">🌲</div><div class="tile">🏠</div><div class="tile">🛣️</div><div class="tile">⬜</div><div class="tile">⬜</div><div class="tile">🌳</div><div class="tile">🛝</div><div class="tile">🛣️</div><div class="tile">⬜</div><div class="tile">⬜</div><div class="tile">⬜</div><div class="tile">🛣️</div><div class="tile">🏫</div><div class="tile">🛣️</div><div class="tile">⬜</div></div></div>
<div class="card"><h3>🧠 能力</h3><div>基礎計算 72%</div><div class="bar"><i style="width:72%"></i></div><div>文字應用 61%</div><div class="bar"><i style="width:61%"></i></div><div>邏輯推理 58%</div><div class="bar"><i style="width:58%"></i></div><div>圖形空間 65%</div><div class="bar"><i style="width:65%"></i></div><div class="small">正式版會依每日作答自動更新</div></div></div></section>
<section id="quiz" class="hidden"><div class="quiz"><div class="qno">每日挑戰 · 第 <span id="num">1</span> / 10 題</div><div class="question" id="question"></div><div class="answers" id="answers"></div><div id="feedback" class="feedback hidden"></div></div></section></main>
<nav class="nav"><button onclick="showHome()">🏠 城市</button><button onclick="startQuiz()">🧠 做題</button><button onclick="alert('自由冒險即將開放')">🎮 冒險</button></nav>
<script>
const qs=[{q:"小明有 24 顆彈珠，又得到 13 顆。現在有幾顆？",a:["35","37","39","41"],ok:1,why:"24 + 13 = 37。先算 20+10=30，再算 4+3=7，所以是 37。"},{q:"找規律：2、4、6、8、？",a:["9","10","11","12"],ok:1,why:"每次都增加 2，所以 8 再加 2 是 10。"},{q:"🐶、🐱、🐰排隊。小狗不是第一個，小兔一定在小貓後面。誰可以站第一個？",a:["小狗","小貓","小兔","三個都可以"],ok:1,why:"小狗不能第一；小兔若第一就不會在小貓後面，所以小貓可以第一。"}];let idx=0,tries=0,start=0;
function startQuiz(){idx=0;tries=0;start=Date.now();home.classList.add('hidden');quiz.classList.remove('hidden');render()}function render(){let x=qs[idx%qs.length];num.textContent=idx+1;question.textContent=x.q;answers.innerHTML='';feedback.classList.add('hidden');x.a.forEach((v,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=v;b.onclick=()=>answer(i);answers.appendChild(b)})}function answer(i){let x=qs[idx%qs.length];if(i===x.ok){feedback.textContent=(tries?'👍 第二次答對！ ':'✅ 第一次就答對！ ')+x.why;feedback.classList.remove('hidden');setTimeout(next,900)}else if(tries===0){tries=1;feedback.textContent='再想一次，我先不公布答案。';feedback.classList.remove('hidden')}else{feedback.textContent='🧠 我們拆開來想：'+x.why;feedback.classList.remove('hidden');setTimeout(next,1500)}}function next(){idx++;tries=0;if(idx>=10){alert('🎉 今日挑戰完成！下一版會結算 EXP、資源與能力。');showHome()}else render()}function showHome(){quiz.classList.add('hidden');home.classList.remove('hidden')}function parentMode(){let p=prompt('爸爸後台 PIN');if(p==='1234')alert('爸爸後台：下一版加入 7/30/90 天能力趨勢、答對率、作答時間與 AI 建議。');else if(p!==null)alert('PIN 不正確')}</script></body></html>
