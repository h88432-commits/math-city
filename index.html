<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5c8df6"><title>數學城市 V1</title>
<style>:root{--bg:#f4f7fb;--ink:#203047;--muted:#6b7a90;--blue:#5c8df6;--green:#55b98b;--line:#e7edf5}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}.app{max-width:900px;margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900}.gear{border:0;background:#fff;border-radius:14px;padding:10px 13px;font-size:18px}.hero,.card,.quiz{background:#fff;border-radius:24px;padding:20px;margin-top:16px;box-shadow:0 10px 30px #31435a12}.hero{background:linear-gradient(135deg,#fff6d8,#e7f8ff)}.row{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#fff;border-radius:14px;padding:10px 13px;font-weight:700}.xp,.bar{height:11px;background:#e8edf4;border-radius:99px;overflow:hidden;margin:9px 0}.xp i,.bar i{display:block;height:100%;background:var(--green)}button.primary{width:100%;border:0;border-radius:18px;padding:17px;font-size:19px;font-weight:900;background:var(--blue);color:#fff;margin-top:14px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;background:#dff0cf;padding:12px;border-radius:20px}.tile{aspect-ratio:1;border-radius:12px;background:#bfe39f;display:grid;place-items:center;font-size:28px}.small{font-size:13px;color:var(--muted)}.hidden{display:none!important}.qno{color:var(--blue);font-weight:800}.question{font-size:23px;font-weight:850;line-height:1.5;margin:18px 0}.answers{display:grid;gap:10px}.ans{border:2px solid var(--line);background:#fff;border-radius:16px;padding:15px;font-size:18px;text-align:left}.feedback{margin-top:14px;padding:13px;border-radius:14px;background:#f3f7ff}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;border-top:1px solid var(--line);display:flex;justify-content:center;gap:35px;padding:11px}.nav button{border:0;background:none;font-weight:800;color:var(--muted)}@media(max-width:600px){.cards{grid-template-columns:1fr}}</style></head>
<body><main class="app"><div class="top"><div class="brand">🏙️ 數學城市 <span class="small">V1</span></div><button class="gear" onclick="parentMode()">⚙️</button></div>
<section id="home"><div class="hero"><div class="row"><span class="pill">Lv. 1 城市開拓者</span><span class="pill">🔥 連續 0 天</span></div><h1>今天也讓城市長大一點吧！</h1><div class="small">EXP 340 / 1000</div><div class="xp"><i style="width:34%"></i></div><button class="primary" onclick="startQuiz()">開始今天的 10 題</button></div>
<div class="cards"><div class="card"><h3>🌱 我的城市</h3><div class="grid"><div class="tile">🌲</div><div class="tile">🏠</div><div class="tile">🛣️</div><div class="tile">⬜</div><div class="tile">⬜</div><div class="tile">🌳</div><div class="tile">🛝</div><div class="tile">🛣️</div><div class="tile">⬜</div><div class="tile">⬜</div><div class="tile">⬜</div><div class="tile">🛣️</div><div class="tile">🏫</div><div class="tile">🛣️</div><div class="tile">⬜</div></div></div>
<div class="card"><h3>🧠 能力</h3><div>基礎計算 72%</div><div class="bar"><i style="width:72%"></i></div><div>文字應用 61%</div><div class="bar"><i style="width:61%"></i></div><div>邏輯推理 58%</div><div class="bar"><i style="width:58%"></i></div><div>圖形空間 65%</div><div class="bar"><i style="width:65%"></i></div><div class="small">正式版會依每日作答自動更新</div></div></div></section>
<section id="quiz" class="hidden"><div class="quiz"><div class="qno">每日挑戰 · 第 <span id="num">1</span> / 10 題</div><div class="question" id="question"></div><div class="answers" id="answers"></div><div id="feedback" class="feedback hidden"></div></div></section></main>
<nav class="nav"><button onclick="showHome()">🏠 城市</button><button onclick="startQuiz()">🧠 做題</button><button onclick="alert('自由冒險即將開放')">🎮 冒險</button></nav>
<script>
const bank=[
{q:"小明有 24 顆彈珠，又得到 13 顆。現在有幾顆？",a:["35","37","39","41"],ok:1,why:"24 + 13 = 37。先算 20+10=30，再算 4+3=7，所以是 37。"},
{q:"一本故事書有 58 頁，小安已經看了 26 頁，還剩幾頁？",a:["30","31","32","34"],ok:2,why:"58 - 26 = 32。先算 58-20=38，再算 38-6=32。"},
{q:"一盒有 5 顆草莓，4 盒一共有幾顆？",a:["9","15","20","25"],ok:2,why:"4 個 5 合起來是 5+5+5+5=20，也就是 4×5=20。"},
{q:"找規律：2、4、6、8、？",a:["9","10","11","12"],ok:1,why:"每次都增加 2，所以 8 再加 2 是 10。"},
{q:"找規律：30、27、24、21、？",a:["17","18","19","20"],ok:1,why:"每次都減少 3，所以 21-3=18。"},
{q:"哪一個數最大？",a:["47","74","44","70"],ok:1,why:"先比較十位數。74 和 70 都有 7 個十，再比較個位，4 比 0 大，所以 74 最大。"},
{q:"現在是 3 點，再過 2 小時是幾點？",a:["4 點","5 點","6 點","1 點"],ok:1,why:"從 3 點往後數兩個小時：4 點、5 點，所以是 5 點。"},
{q:"🐶、🐱、🐰排隊。小狗不是第一個，小兔一定在小貓後面。誰可以站第一個？",a:["小狗","小貓","小兔","三個都可以"],ok:1,why:"小狗不能第一；小兔若第一就不會在小貓後面，所以小貓可以第一。"},
{q:"紅、藍、黃三個盒子中只有一個有寶物。寶物不在紅盒，也不在黃盒。寶物在哪裡？",a:["紅盒","藍盒","黃盒","無法知道"],ok:1,why:"排除紅盒和黃盒，只剩下藍盒。"},
{q:"小美比小華高，小華比小明高。誰最高？",a:["小明","小華","小美","一樣高"],ok:2,why:"小美 > 小華 > 小明，所以小美最高。"},
{q:"有 12 顆糖平均分給 3 個人，每人幾顆？",a:["3","4","5","6"],ok:1,why:"12 顆分成 3 份，每份 4 顆，因為 4+4+4=12。"},
{q:"哪一個算式的答案是 36？",a:["20+15","40-5","18+18","30+5"],ok:2,why:"18+18=36。"},
{q:"找規律：5、10、15、20、？",a:["21","24","25","30"],ok:2,why:"每次增加 5，所以 20+5=25。"},
{q:"四個小朋友排隊，小安在小美前面，小美在小華前面。三人之中誰最前面？",a:["小安","小美","小華","不能確定"],ok:0,why:"小安在小美前，小美又在小華前，因此小安最前面。"},
{q:"一枝鉛筆 8 元，買 3 枝要多少元？",a:["11","16","24","32"],ok:2,why:"3 個 8 是 8+8+8=24。"},
{q:"袋子裡有紅球和藍球。拿出一顆一定會是紅球。下面哪個情況才可能成立？",a:["袋裡只有紅球","袋裡只有藍球","紅藍各一顆","袋子是空的"],ok:0,why:"要保證拿到紅球，袋子裡不能有藍球，所以只有紅球才符合。"},
{q:"小明從家往東走一格，再往東走一格，最後往西走一格。他最後在家的哪一邊？",a:["東邊一格","西邊一格","回到家","北邊一格"],ok:0,why:"東兩格再往西一格，等於最後在家東邊一格。"},
{q:"有 3 種帽子和 2 種上衣，每次選一頂帽子和一件上衣，一共有幾種不同搭配？",a:["5","6","8","9"],ok:1,why:"每頂帽子都可以搭 2 件上衣，所以 2+2+2=6 種。"},
{q:"哥哥有 40 元，買了 17 元的橡皮擦，還剩多少元？",a:["21","22","23","24"],ok:2,why:"40-17=23。可以先減 10 得 30，再減 7 得 23。"},
{q:"哪一個圖形和其他三個不同類？",a:["△","▲","▽","○"],ok:3,why:"前三個都是三角形，○ 是圓形，所以它不同類。"}
];
function shuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
const USED_KEY="mathCityUsedQuestionsV1"; const STATS_KEY="mathCityStatsV1";
function qid(q){let h=2166136261;for(let i=0;i<q.length;i++){h^=q.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function getUsed(){try{return JSON.parse(localStorage.getItem(USED_KEY)||"[]")}catch(e){return []}}
function saveUsed(ids){localStorage.setItem(USED_KEY,JSON.stringify([...new Set(ids)]))} function getStats(){try{return JSON.parse(localStorage.getItem(STATS_KEY)||'{"sessions":0,"questions":0}') }catch(e){return {sessions:0,questions:0}}} function saveStats(s){localStorage.setItem(STATS_KEY,JSON.stringify(s))}
function unseenQuestions(){const used=new Set(getUsed());return bank.filter(x=>!used.has(qid(x.q)))}
let qs=[],idx=0,tries=0,start=0;
function startQuiz(){
 const unseen=unseenQuestions();
 if(unseen.length<10){alert("目前尚未有足夠的全新題目可以開始今天的 10 題。系統不會用舊題湊數。正式版會由 AI 補充並驗證新題。");return}
 qs=shuffle(unseen).slice(0,10);saveUsed(getUsed().concat(qs.map(x=>qid(x.q))));
 idx=0;tries=0;start=Date.now();home.classList.add('hidden');quiz.classList.remove('hidden');render()}function render(){let x=qs[idx%qs.length];num.textContent=idx+1;question.textContent=x.q;answers.innerHTML='';feedback.classList.add('hidden');x.a.forEach((v,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=v;b.onclick=()=>answer(i);answers.appendChild(b)})}function answer(i){let x=qs[idx%qs.length];if(i===x.ok){feedback.textContent=(tries?'👍 第二次答對！ ':'✅ 第一次就答對！ ')+x.why;feedback.classList.remove('hidden');setTimeout(next,900)}else if(tries===0){tries=1;feedback.textContent='再想一次，我先不公布答案。';feedback.classList.remove('hidden')}else{feedback.textContent='🧠 我們拆開來想：'+x.why;feedback.classList.remove('hidden');setTimeout(next,1500)}}function next(){idx++;tries=0;if(idx>=10){let s=getStats();s.sessions++;s.questions+=10;saveStats(s);alert('🎉 今日挑戰完成！\\n本機已記錄這 10 題為「已使用」，之後正式挑戰不會再抽到。\\n\\n目前 V1 的 EXP、資源與能力畫面仍是展示值；下一階段接雲端與 AI 後才會正式計算。');showHome()}else render()}function showHome(){quiz.classList.add('hidden');home.classList.remove('hidden')}function parentMode(){let p=prompt('爸爸後台 PIN');if(p==='1234'){let s=getStats();alert('爸爸後台 V1\\n\\n已完成挑戰：'+s.sessions+' 次\\n正式作答：'+s.questions+' 題\\n已使用題目：'+getUsed().length+' 題\\n\\n注意：目前資料保存在這台裝置的瀏覽器；雲端同步與 AI 能力分析會在下一階段加入。');}else if(p!==null)alert('PIN 不正確')}</script></body></html>
